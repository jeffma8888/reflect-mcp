[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflect-mcp"
version = "0.1.0"
description = "An MCP server for LLM tasks that verify themselves: Generator -> second-model Critic -> human-in-the-loop gate. Never a silent wrong answer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jeffma8888" }]
keywords = ["mcp", "agents", "llm", "reflection", "critic", "human-in-the-loop", "extraction", "eval"]
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
# MCP server surface (only needed to actually serve the tool over MCP).
server = ["mcp>=1.2.0"]
# Provider SDKs are optional so the base install + offline tests stay light.
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.30"]
bedrock = ["boto3>=1.34"]
# Everything a contributor needs to run the deterministic test + eval suite offline.
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
reflect-mcp = "reflect_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jeffma8888/reflect-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/reflect_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src", "eval"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["reflect_mcp"]
omit = ["*/server.py", "*/providers.py"]
